spring.application.name=smart-parking-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/parking;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=43200
app.demo.enabled=${DEMO_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
server.error.include-message=never
logging.level.com.smartparking=INFO
